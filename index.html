<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLD 项目 - 页面导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    max-width: 640px;
    width: 100%;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 15px;
    color: #86868b;
    margin-bottom: 32px;
  }
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 18px 24px;
    text-decoration: none;
    color: inherit;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: box-shadow 0.2s, transform 0.1s;
    border: 1px solid #e6e6ea;
  }
  .card:hover {
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    transform: translateY(-1px);
  }
  .card .info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .card .title {
    font-size: 16px;
    font-weight: 600;
  }
  .card .desc {
    font-size: 13px;
    color: #86868b;
  }
  .card .arrow {
    font-size: 18px;
    color: #c7c7cc;
  }
  .footer {
    margin-top: 40px;
    font-size: 13px;
    color: #a1a1a6;
  }
</style>
</head>
<body>
<div class="container">
  <h1>SLD 项目页面</h1>
  <p class="subtitle">选择下方页面查看原型</p>
  <div class="card-list">
    <a href="01_pdp_prototype.html" class="card">
      <div class="info">
        <span class="title">PDP 原型 - 产品详情页</span>
        <span class="desc">Product Detail Page 改造</span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="02_watch_page_prototype.html" class="card">
      <div class="info">
        <span class="title">Watchpage 原型</span>
        <span class="desc">Watch 页面设计</span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="03a_admin_pdp_hero_video.html" class="card">
      <div class="info">
        <span class="title">Admin - PDP Hero Video</span>
        <span class="desc">后台产品详情页主视频管理</span>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="03b_admin_watch_page.html" class="card">
      <div class="info">
        <span class="title">Admin - Watch Page</span>
        <span class="desc">后台 Watch 页面管理</span>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
  <div class="footer">SLD Project v6.0</div>
</div>
</body>
</html>
